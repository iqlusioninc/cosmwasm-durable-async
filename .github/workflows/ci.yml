name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  wasm-vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: scripts/install-binaryen.sh
      - name: Check and execute compiled Wasm
        run: scripts/check-wasm.sh
      - run: cargo fmt --manifest-path tools/vm-tests/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/vm-tests/Cargo.toml --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: validated-wasm
          path: target/artifacts/
