[package]
name = "native-batch-auction"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[[example]]
name = "auction_fault"
crate-type = ["cdylib"]
required-features = ["library"]

[dependencies]
cosmwasm-std.workspace = true
serde.workspace = true
thiserror.workspace = true
native-async = { path = "../../crates/native-async" }
durable-runtime = { path = "../../crates/durable-runtime", features = ["native"] }
durable-macro = { path = "../../crates/durable-macro" }
sha2 = "0.10.9"

[dev-dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cw-multi-test = "2.5"
native-async = { path = "../../crates/native-async", features = ["host"] }
