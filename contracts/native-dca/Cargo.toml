[package]
name = "native-dca"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "dca_fault"
crate-type = ["cdylib"]

[dependencies]
cosmwasm-std.workspace = true
serde.workspace = true
thiserror.workspace = true
native-async = { path = "../../crates/native-async" }
durable-runtime = { path = "../../crates/durable-runtime", features = ["native"] }
durable-macro = { path = "../../crates/durable-macro" }
dca-example-protocol = { path = "../dca-protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cw-multi-test = "2.5"
native-async = { path = "../../crates/native-async", features = ["host"] }
mock-exchange = { path = "../mock-exchange" }
